# Game rules. Values marked "placeholder" are untuned guesses.

[sensor.optical]
track_range_factor = 1.5  # contact range = optical range_m * factor
fire_quality = 3          # quality inside the optical range_m
contact_quality = 1       # quality between range and range * factor

[sensor.radar]
quality = 2               # position + class; not enough to fire (needs 3)
jam_quality_drop = 1      # an enemy jammer covering the radar lowers its tracks by this

[sensor.esm]
bearing_quality = 1       # one bearing: direction only
triangulated_quality = 2  # two bearings crossing at >= min_cross_deg
min_cross_deg = 20.0      # placeholder
bearing_update_deg = 2.0  # re-report a bearing-only track when it moves this much

[sensor.sonar]
active_quality = 2        # an active sonar gives position + class of ships and submarines in range

[combat]
partial_pen_threshold = 0.7  # penetration >= 70% of effective armour -> partial damage
partial_damage_factor = 0.25 # placeholder; fraction of damage on a partial penetration
damaged_hp_fraction = 0.5    # at or below this share of hp a unit is damaged (half speed)
damaged_speed_factor = 0.5   # damaged units move at half speed
return_fire_s = 60.0         # 'return' stance may fire this long after being shot at
air_fire_quality = 2         # anti-air weapons fire on a radar lock (quality 2)

[kbg]
budget_per_turn = 8   # command points per player per turn
order_cost = 1        # points per order...
units_per_point = 12  # ...for every started 12 units in it (group orders)

[visibility]
contact_cell_m = 500.0  # placeholder; quality-1 contacts snap to this grid

[turn]
planning_secs = 60
game_seconds_per_tick = 0.6  # 200 ticks = 2 min of game time per turn

[zones]
capture_s = 60.0       # placeholder; uncontested infantry presence needed to capture
max_turns = 100        # highest score wins after this turn

[supply]
radius_m = 300.0       # placeholder; resupply reach of trucks and storages at the end of a turn
region_share = 0.25    # placeholder; share of its capacity a unit gets per turn inside a supplied own region
attrition_after_turns = 3   # ground units start to wither at the end of the 3rd unsupplied turn in a row
attrition_hp_share = 0.1    # ...losing this share of their maximum hp per turn

[comms]
wire_reach_m = 150.0   # placeholder; distance to a road cell to plug into its wire network
radio_emit_s = 20.0    # placeholder; a unit that gets an order by radio transmits this long (enemy ESM hears it)

[indirect]
min_track_quality = 2  # fire missions at a unit need its position (radar, triangulation or sight)
counter_fire_window_s = 120.0  # placeholder; guns on 'return' fire at an enemy gun located this recently

[transport]
embark_radius_m = 100.0  # placeholder
bail_out_damage = 0.5    # passengers lose half their hp when the carrier is destroyed
ship_embark_radius_m = 300.0   # placeholder; boarding a ship from the shore / landing onto it (K-164)
landing_suppression = 1.0      # placeholder; a unit just put ashore starts fully suppressed
naval_fire_quality = 2         # weapons fire at ships and submarines on a radar or sonar fix

[medical]
radius_m = 300.0         # placeholder; medical units treat infantry this close at the end of a turn

[conceal]                 # K-140; factors on the optical range of whoever looks at the unit (multiplied)
forest_factor = 0.5       # placeholder; standing in forest
settlement_factor = 0.6   # placeholder; standing in a settlement
infantry_factor = 0.7     # placeholder; infantry is small
halted_factor = 0.7       # placeholder; not moving
fire_reveal_s = 30.0      # placeholder; no concealment for this long after firing

[cover]                   # K-141; damage multipliers for infantry in cover
forest_damage_factor = 0.75      # placeholder
settlement_damage_factor = 0.6   # placeholder

[ambush]                  # K-142; the 'ambush' stance
range_share = 0.5         # placeholder; hold fire until the target is within half the weapon range
damage_factor = 1.5       # placeholder; damage multiplier while the enemy has not located the shooter

[suppression]             # K-143; 0..1 per ground unit
per_shot = 0.15           # placeholder; per direct-fire shot aimed at the unit
per_shell = 0.3           # placeholder; shell landing on the unit (less towards the blast edge)
decay_per_s = 0.02        # placeholder; full suppression wears off in 50 s
hit_penalty = 0.6         # placeholder; hit share lost at full suppression
speed_penalty = 0.5       # placeholder; speed lost at full suppression
pin_threshold = 0.6       # placeholder; infantry at or above this lies down and does not move
pinned_damage_factor = 0.6  # placeholder; pinned infantry is harder to hurt

[economy]                 # K-170…K-173
start_money = 300         # placeholder
region_income = 20        # placeholder; per turn for every own region that is in supply
launch_radius_m = 1000.0  # placeholder; ships bought at a port appear on the nearest water this close

[decoy]                   # K-144
reveal_range_m = 800.0    # placeholder; eyes this close recognise a decoy for good
