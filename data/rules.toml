# Game rules. Values marked "placeholder" are untuned guesses.

[sensor.optical]
track_range_factor = 1.5  # contact range = optical range_m * factor
fire_quality = 3          # quality inside the optical range_m
contact_quality = 1       # quality between range and range * factor

[sensor.radar]
quality = 2               # position + class; not enough to fire (needs 3)
jam_quality_drop = 1      # an enemy jammer covering the radar lowers its tracks by this

[sensor.esm]
bearing_quality = 1       # one bearing: direction only
triangulated_quality = 2  # two bearings crossing at >= min_cross_deg
min_cross_deg = 20.0      # placeholder
bearing_update_deg = 2.0  # re-report a bearing-only track when it moves this much

[combat]
partial_pen_threshold = 0.7  # penetration >= 70% of effective armour -> partial damage
partial_damage_factor = 0.25 # placeholder; fraction of damage on a partial penetration
damaged_hp_fraction = 0.5    # at or below this share of hp a unit is damaged (half speed)
damaged_speed_factor = 0.5   # damaged units move at half speed
return_fire_s = 60.0         # 'return' stance may fire this long after being shot at

[kbg]
budget_per_turn = 8   # command points per player per turn
order_cost = 1        # points per order...
units_per_point = 12  # ...for every started 12 units in it (group orders)

[visibility]
contact_cell_m = 500.0  # placeholder; quality-1 contacts snap to this grid

[turn]
planning_secs = 45
game_seconds_per_tick = 0.6  # 200 ticks = 2 min of game time per turn

[zones]
capture_s = 60.0       # placeholder; uncontested infantry presence needed to capture
victory_points = 100   # placeholder
max_turns = 100        # highest score wins after this turn

[supply]
radius_m = 300.0       # placeholder; resupply reach at the end of a turn
