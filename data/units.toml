# Unit type definitions. Values marked "placeholder" are untuned guesses.
# Sensors: optical {range_m}; radar {range_m, min_target_speed_mps} (active, emits when on);
# esm {range_m} (passive, bearings to emitters); jammer {range_m} (emits when on, degrades enemy radar in range).
# Supply: supply_fuel_l / supply_ammo are the stock a supply unit carries for others.

[[unit]]
id = "infantry"
name_tr = "Piyade"
class = "infantry"
speed_offroad_mps = 1.5          # placeholder
speed_road_mps = 1.8             # placeholder
max_slope_deg = 40.0             # placeholder
armor_front_mm = 0.0
armor_side_mm = 0.0
armor_rear_mm = 0.0
weapon_range_m = 400.0
penetration_mm = 5.0             # placeholder
damage_hp = 8.0                  # placeholder; expected hp per hit
reload_s = 3.0                   # placeholder; game seconds between shots
hit_close = 0.5                  # placeholder; expected hit share at point blank
hit_far = 0.1                    # placeholder; at maximum range
aim_s = 3.0                      # placeholder; time in sights before the first shot
height_m = 1.8                   # placeholder
hp = 100.0                       # placeholder
fuel_l = 0.0                     # on foot: no fuel
fuel_l_per_km = 0.0
ammo = 60                        # placeholder; bursts
sensors = [{ kind = "optical", range_m = 1000.0 }]  # placeholder

