# Unit type definitions. Values marked "placeholder" are untuned guesses.
# Sensors: optical {range_m}; radar {range_m, min_target_speed_mps} (active, emits when on);
# esm {range_m} (passive, bearings to emitters); jammer {range_m} (emits when on, degrades enemy radar in range).
# Supply (K-130…K-134): supply_fuel_l / supply_ammo are the stock capacity of a carrier (truck, cargo plane) or of a
# storage structure (logistics base, depot, airfield, port); produce_* is what a logistics base makes per turn.
# deploy_s (K-120): seconds to set up after halting / pack up before moving; not set up = no fire, no radar/ESM/jammer.
# Naval (K-160…K-165): class = "ship" / "sub" (water only); weapon_vs_sea / weapon_vs_sub; sensors sonar_active
# (pings when the unit emits) and sonar_passive; carry_vehicles (landing ship); quiet_speed_mps.
# decoy_of (K-144): a dummy; the enemy sees the named type until he looks at it from close up.
# class = "structure" (K-121): never moves, changes hands with its region. heal_hp_per_turn (K-123): treats infantry nearby.

